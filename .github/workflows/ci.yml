name: Build and Test

on:
  pull_request:
    branches: [develop, main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Debug
  LOCAL: local

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: hdevarajan92/brahma-ci:latest
    strategy:
      fail-fast: false
      
      matrix:
        include:
          - hdf5: "hdf5@1.8.23"
            mpi: "mpich@3.4.3"
          - hdf5: "hdf5@1.10.11"
            mpi: "openmpi@4.1.6"
          - hdf5: "hdf5@1.12.3"
            mpi: "mpich@4.2.3"
          - hdf5: "hdf5@1.14.5"
            mpi: "openmpi@5.0.6"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Build
        shell: bash
        run: |
          source .github/workflows/scripts/load_env.sh ${{ matrix.hdf5 }} ${{ matrix.mpi }}
          mkdir -p build
          CMAKE_ARGS=(
            "-DCMAKE_BUILD_TYPE=Debug"
            "-DBRAHMA_ENABLE_TESTING=ON"
            "-DBRAHMA_GENERATE_INTERFACES=OFF"
            "-DBRAHMA_BUILD_WITH_HDF5=ON"
            "-DBRAHMA_BUILD_WITH_MPI=ON"
            "-DHDF5_ROOT=$HDF5_DIR"
            "-DMPI_ROOT=$MPI_DIR"
          )
          cmake -Bbuild "${CMAKE_ARGS[@]}" -DBRAHMA_BUILD_DEPENDENCIES=ON
          make -C build -j
      - name: Test
        shell: bash
        run: |
          source .github/workflows/scripts/load_env.sh ${{ matrix.hdf5 }} ${{ matrix.mpi }}
          ctest --test-dir build -VV


  glibc:
    # manylinux_2_28 is the baseline used by the dftracer cibuildwheel wheels.
    runs-on: ubuntu-24.04
    name: glibc ${{ matrix.glibc }}
    container:
      image: quay.io/pypa/manylinux_${{ matrix.tag }}_x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: "2_28", glibc: "2.28" }
          - { tag: "2_34", glibc: "2.34" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Check glibc version
        run: ldd --version | head -1 | grep -q " ${{ matrix.glibc }}$"
      - name: Build
        run: |
          cmake -Bbuild \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBRAHMA_ENABLE_TESTING=ON \
            -DBRAHMA_GENERATE_INTERFACES=OFF \
            -DBRAHMA_BUILD_DEPENDENCIES=ON
          make -C build -j
      - name: Test
        run: ctest --test-dir build -VV
